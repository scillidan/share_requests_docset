name: Release

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

env:
  upstream_owner: 'psf'
  upstream_repo: 'requests'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
    - name: Checkout self repo
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v6

    - name: Get latest Requests version
      id: get_version
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        version=$(curl -s "https://api.github.com/repos/${{ env.upstream_owner }}/${{ env.upstream_repo }}/releases/latest" | python3 -c "import sys, json; print(json.load(sys.stdin)['tag_name'].lstrip('v'))")
        echo "version=$version" >> $GITHUB_OUTPUT
        echo "Latest Requests version: $version"

    - name: Check if version tag already exists
      id: check_version
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VERSION: ${{ steps.get_version.outputs.version }}
        REPO: ${{ github.repository }}
      run: |
        status=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $GH_TOKEN" \
          "https://api.github.com/repos/$REPO/releases/tags/$VERSION")
        if [ "$status" = "200" ]; then
          echo "should_release=false" >> $GITHUB_OUTPUT
          echo "Release $VERSION already exists in $REPO, skipping..."
        else
          echo "should_release=true" >> $GITHUB_OUTPUT
        fi

    - name: Set up Python
      if: ${{ steps.check_version.outputs.should_release == 'true' }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      if: ${{ steps.check_version.outputs.should_release == 'true' }}
      run: pip install doc2dash sphinx

    - name: Download and build documentation
      if: ${{ steps.check_version.outputs.should_release == 'true' }}
      env:
        VERSION: ${{ steps.get_version.outputs.version }}
      run: |
        curl -L -o source.zip "https://github.com/${{ env.upstream_owner }}/${{ env.upstream_repo }}/archive/refs/tags/v${VERSION}.zip"
        unzip -q source.zip
        cd requests-${VERSION}/docs
        make html
        cd ../..
        mv requests-${VERSION}/docs/_build/html _html
        doc2dash --name "Requests" --icon assets/icon.png --icon-2x assets/icon@2x.png -f -I index.html -v _html

    - name: Create tgz
      if: ${{ steps.check_version.outputs.should_release == 'true' }}
      run: |
        tar --exclude='.DS_Store' -czf "Requests.tgz" "Requests.docset"
        rm -rf "Requests.docset"

    - name: Generate checksums.txt
      if: ${{ steps.check_version.outputs.should_release == 'true' }}
      run: |
        sha256sum Requests.tgz > checksums.txt

    - name: Create GitHub Release
      if: ${{ steps.check_version.outputs.should_release == 'true' }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VERSION: ${{ steps.get_version.outputs.version }}
      run: |
        gh release create "$VERSION" \
          Requests.tgz \
          checksums.txt \
          --title "$VERSION" \
          --notes "Source: https://github.com/${{ env.upstream_owner }}/${{ env.upstream_repo }}"

    - name: Create or update XML file
      if: ${{ steps.check_version.outputs.should_release == 'true' }}
      env:
        VERSION: ${{ steps.get_version.outputs.version }}
      run: |
        TAG="$VERSION"
        echo "<entry>" > Requests.xml
        echo "  <name>Requests</name>" >> Requests.xml
        echo "  <version>$VERSION</version>" >> Requests.xml
        echo "  <url>https://github.com/${{ github.repository }}/releases/download/$TAG/Requests.tgz</url>" >> Requests.xml
        echo "</entry>" >> Requests.xml

    - name: Commit and push XML
      if: ${{ steps.check_version.outputs.should_release == 'true' }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ steps.get_version.outputs.version }}
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git fetch origin
        git checkout ${GITHUB_REF_NAME} || git checkout -b ${GITHUB_REF_NAME}
        git add Requests.xml 2>/dev/null || true
        if git diff --cached --quiet; then
          echo "No changes to Requests.xml, skipping commit."
          exit 0
        fi
        git commit -m "Update Requests.xml for release $TAG"
        git push origin HEAD:${GITHUB_REF_NAME}
