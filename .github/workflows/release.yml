name: Release

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 * *'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    outputs:
      latest_version: ${{ steps.get_version.outputs.version }}
      should_release: ${{ steps.check_version.outputs.should_release }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v6

    - name: Get latest Requests version
      id: get_version
      run: |
        version=$(curl -s "https://api.github.com/repos/psf/requests/releases/latest" | python3 -c "import sys, json; print(json.load(sys.stdin)['tag_name'].lstrip('v'))")
        echo "version=$version" >> $GITHUB_OUTPUT

    - name: Check if version tag already exists
      id: check_version
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VERSION: ${{ steps.get_version.outputs.version }}
        REPO: ${{ github.repository }}
      run: |
        status=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $GH_TOKEN" \
          "https://api.github.com/repos/$REPO/releases/tags/${VERSION}")
        if [ "$status" = "200" ]; then
          echo "should_release=false" >> $GITHUB_OUTPUT
          echo "Release $VERSION already exists in $REPO, skipping..."
        else
          echo "should_release=true" >> $GITHUB_OUTPUT
        fi

    - name: Set up Python
      if: ${{ steps.check_version.outputs.should_release == 'true' }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      if: ${{ steps.check_version.outputs.should_release == 'true' }}
      run: pip install doc2dash sphinx

    - name: Download and build documentation
      if: ${{ steps.check_version.outputs.should_release == 'true' }}
      env:
        VERSION: ${{ steps.get_version.outputs.version }}
      run: |
        curl -L -o source.zip "https://github.com/psf/requests/archive/refs/tags/v${VERSION}.zip"
        unzip -q source.zip
        cd requests-${VERSION}/docs
        make html
        cd ../..
        mv requests-${VERSION}/docs/_build/html _html
        doc2dash --name "Requests" --icon assets/icon.png --icon-2x assets/icon@2x.png -f -I index.html -v _html

    - name: Create tgz
      if: ${{ steps.check_version.outputs.should_release == 'true' }}
      run: |
        basename="Requests.docset"
        tar --exclude='.DS_Store' -czf "$basename.tgz" "$basename"
        rm -rf "$basename"

    - name: Generate SHA256 checksums
      if: ${{ steps.check_version.outputs.should_release == 'true' }}
      run: |
        for file in *.tgz; do
          sha256sum "$file" > "$file.sha256";
        done

    - name: Create GitHub Release
      if: ${{ steps.check_version.outputs.should_release == 'true' }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VERSION: ${{ steps.get_version.outputs.version }}
      run: |
        gh release create "$VERSION" \
          *.tgz \
          --title "$VERSION" \
          --generate-notes

    - name: Create or update XML files
      if: ${{ steps.check_version.outputs.should_release == 'true' }}
      env:
        VERSION: ${{ steps.get_version.outputs.version }}
      run: |
        {
          echo '<?xml version="1.0" encoding="UTF-8"?>'
          echo '<xml>'
          echo '  <entry>'
          echo '    <name>Requests</name>'
          echo "    <version>$VERSION</version>"
          echo "    <url>https://github.com/${{ github.repository }}/releases/download/$VERSION/Requests.docset.tgz</url>"
          echo '  </entry>'
          echo '</xml>'
        } > Requests.xml

    - name: Commit and push XML
      if: ${{ steps.check_version.outputs.should_release == 'true' }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VERSION: ${{ steps.get_version.outputs.version }}
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        if git ls-files --error-unmatch Requests.xml >/dev/null 2>&1; then
          if git diff --quiet Requests.xml; then
            echo "No changes to Requests.xml, skipping commit."
            exit 0
          fi
        fi
        git add Requests.xml
        git commit -m "doc: update Requests.xml for release $VERSION" || true
        git push
